  <text x="450.0" y="76.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">层级 1 (应用与算法层): 四足机器人全身移动操作策略 (ReLIC / Parkour) + RSL-RL PPO 训练器</text>
  <rect x="40" y="102" width="820" height="38" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="450.0" y="126.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">层级 2 (机器人学习框架层): NVIDIA Isaac Lab v2.3 (Manager-based MDP 环境 / 传感器 / 域随机化)</text>
  <rect x="40" y="152" width="820" height="38" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="450.0" y="176.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">层级 3 (物理与仿真引擎层): NVIDIA Isaac Sim 5.1 (Omniverse Kit / PhysX 5 GPU 张量动力学流)</text>
  <rect x="40" y="202" width="820" height="32" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="450.0" y="223.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">层级 4 (底层硬件驱动层): NVIDIA GPU 驱动 (CUDA 12.x 张量加速 + Vulkan 1.3 / EGL 光线追踪渲染)</text>

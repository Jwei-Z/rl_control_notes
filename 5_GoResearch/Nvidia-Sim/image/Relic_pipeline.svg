<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="1600" height="545" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="320" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="16" y="16" width="410" height="288" rx="12" fill="#f1f8ff" fill-opacity="0.75" stroke="#1971c2" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="32" y="42" font-size="14.5" font-weight="700" fill="#1864ab">1. 离线强化学习训练 · ReLIC (Isaac Lab)</text>
  <rect x="40" y="62" width="362" height="58" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="221.0" y="85.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">阶段 1: 四足与三足动态步态基础平衡</text>
  <text x="221.0" y="106.5" text-anchor="middle" font-size="13.5" fill="#2b3035">4096 并行环境预训练鲁棒支撑与外力抗扰</text>
  <rect x="40" y="144" width="362" height="58" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <text x="221.0" y="167.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">阶段 2–4: 多肢体角色切换与全身协同课程</text>
  <text x="221.0" y="188.5" text-anchor="middle" font-size="13.5" fill="#2b3035">角色掩码 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> + 阻尼最小二乘微分 IK (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">J</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">†</tspan>)</text>
  <rect x="40" y="226" width="362" height="58" rx="10" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
  <text x="221.0" y="249.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">导出紧凑策略网络权重</text>
  <text x="221.0" y="270.5" text-anchor="middle" font-size="13.5" fill="#2b3035">PyTorch (.pt) → ONNX Runtime (约 800 KB)</text>
  <rect x="514" y="16" width="410" height="288" rx="12" fill="#f3fbf4" fill-opacity="0.75" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="530" y="42" font-size="14.5" font-weight="700" fill="#2b8a3e">2. 在线实时采样规划 · SUMO (MuJoCo C++)</text>
  <rect x="538" y="62" width="362" height="58" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="719.0" y="85.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">高层在线零阶采样优化器 (20 Hz CEM)</text>
  <text x="719.0" y="106.5" text-anchor="middle" font-size="13.5" fill="#2b3035">4 节点样条控制点采样 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">A</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan>，滚动优化任务代价 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">J</tspan></text>
  <rect x="538" y="144" width="362" height="58" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="719.0" y="167.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">MuJoCo 多线程刚体与接触动力学打靶</text>
  <text x="719.0" y="188.5" text-anchor="middle" font-size="13.5" fill="#2b3035">64 线程并行推演 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan>+1</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">f</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">RL</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">g</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>)))</text>
  <rect x="538" y="226" width="362" height="58" rx="10" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
  <text x="719.0" y="249.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">零样本加载 ReLIC 预训练 ONNX 权重</text>
  <text x="719.0" y="270.5" text-anchor="middle" font-size="13.5" fill="#2b3035">50 Hz 闭环输出 19 维关节目标驱动全身移动操作</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="1600" height="357" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="210" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="182" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">ANYmal Parkour 三层多频异步感知—导航—技能执行流水线 (§2–§6)</text>
  <rect x="26" y="54" width="205" height="102" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="128.5" y="78.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 点云体素化与对齐 (30 Hz)</text>
  <text x="128.5" y="99.5" text-anchor="middle" font-size="13.5" fill="#2b3035">6 深度相机 + 1 激光雷达</text>
  <text x="128.5" y="120.5" text-anchor="middle" font-size="13.5" fill="#2b3035">刚体逆变换 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">T</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>←<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>−1</tspan> 对齐历史网格</text>
  <text x="128.5" y="141.5" text-anchor="middle" font-size="13.5" fill="#2b3035">粗糙 (12.5 cm) + 精细 (6.25 cm)</text>
  <rect x="257" y="54" width="205" height="102" rx="10" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
  <text x="359.5" y="78.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 3D 卷积自编码器 (30 Hz)</text>
  <text x="359.5" y="99.5" text-anchor="middle" font-size="13.5" fill="#2b3035">损失 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ℒ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">occ</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">λ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ℒ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">cent</tspan> 无监督重建</text>
  <text x="359.5" y="120.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输出隐空间信念 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">z</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">belief</tspan> ∈ ℝ⁵¹²</text>
  <text x="359.5" y="141.5" text-anchor="middle" font-size="13.5" fill="#2b3035">与局部去噪高程图</text>
  <rect x="488" y="54" width="205" height="102" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="590.5" y="78.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 混合分布导航策略 (5 Hz)</text>
  <text x="590.5" y="99.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输入 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">z</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">belief</tspan> 与全局目标相对位姿</text>
  <text x="590.5" y="120.5" text-anchor="middle" font-size="13.5" fill="#2b3035">离散分支选技能 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan> ∈ {1..5}</text>
  <text x="590.5" y="141.5" text-anchor="middle" font-size="13.5" fill="#2b3035">连续分支给 [Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">x</tspan>, Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">y</tspan>, Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ψ</tspan>, Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>]</text>
  <rect x="719" y="54" width="195" height="102" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="816.5" y="78.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 专精技能专家库 (50 Hz)</text>
  <text x="816.5" y="99.5" text-anchor="middle" font-size="13.5" fill="#2b3035">激活 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan></tspan> (爬箱/钻桌/跳崖/滑降)</text>
  <text x="816.5" y="120.5" text-anchor="middle" font-size="13.5" fill="#2b3035">延迟稀疏时钟位置奖励驱动</text>
  <text x="816.5" y="141.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输出 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">des</tspan> → 400 Hz SEA 电机</text>
  <polyline points="231,105 257,105" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="462,105 488,105" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="693,105 719,105" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
</svg>

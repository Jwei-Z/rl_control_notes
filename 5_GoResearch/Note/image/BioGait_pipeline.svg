<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="1600" height="409" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="240" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="212" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">仿生多步态决策 (π_G) + 程序性记忆调度 (BGS) + 运动微调 (π_L) 全栈架构 (§2–§3)</text>
  <rect x="26" y="54" width="195" height="106" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="123.5" y="80.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 本体状态估计器 (SE)</text>
  <text x="123.5" y="101.5" text-anchor="middle" font-size="13.5" fill="#2b3035">IMU + 编码器 + 足底压力 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">σ</tspan></text>
  <text x="123.5" y="122.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输出 50 维状态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan> 与 4 项指标</text>
  <text x="123.5" y="143.5" text-anchor="middle" font-size="13.5" fill="#2b3035">(CoT, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">W</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">ext</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">c</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">avg</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">err</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">%</tspan>)</text>
  <rect x="249" y="54" width="200" height="106" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="349.0" y="80.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 步态决策网络 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">G</tspan> (100 Hz)</text>
  <text x="349.0" y="101.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输入观测 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">o</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">G</tspan> = [<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">β</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">G</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">v</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">cmd</tspan>]</text>
  <text x="349.0" y="122.5" text-anchor="middle" font-size="13.5" fill="#2b3035">从 8 种候选步态模板中</text>
  <text x="349.0" y="143.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输出最优步态索引 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan> ∈ [0, 7]</text>
  <rect x="477" y="54" width="205" height="106" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="579.5" y="80.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 仿生步态调度器 BGS</text>
  <text x="579.5" y="101.5" text-anchor="middle" font-size="13.5" fill="#2b3035">弗劳德数自适应平滑相位过渡</text>
  <text x="579.5" y="122.5" text-anchor="middle" font-size="13.5" fill="#2b3035">Raibert / LIPM 公式生成</text>
  <text x="579.5" y="143.5" text-anchor="middle" font-size="13.5" fill="#2b3035">足端参考 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">β</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">L</tspan> ∈ ℝ¹⁶, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">β</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">G</tspan> ∈ ℝ¹⁰</text>
  <rect x="710" y="54" width="202" height="106" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="811.0" y="80.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 运动网络 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">L</tspan> 与 1 kHz PD</text>
  <text x="811.0" y="101.5" text-anchor="middle" font-size="13.5" fill="#2b3035">500 Hz <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">L</tspan> 微调输出目标角 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan></text>
  <text x="811.0" y="122.5" text-anchor="middle" font-size="13.5" fill="#2b3035">PD: <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">p</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan>−<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q</tspan>) − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">d</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q&#x0307;</tspan></text>
  <text x="811.0" y="143.5" text-anchor="middle" font-size="13.5" fill="#2b3035">驱动 Unitree A1 12 关节电机</text>
  <polyline points="221,107 249,107" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="449,107 477,107" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="451.0" y="81.0" width="24.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="463.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan></text>
  <polyline points="682,107 710,107" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="684.0" y="81.0" width="24.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="696.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">β</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">L</tspan></text>
  <polyline points="580,160 580,186 349,186 349,160" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="385.0" y="167.0" width="160.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="465.0" y="182.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">回传 10 维稳定性特征 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">β</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">G</tspan></text>
  <polyline points="811,160 811,208 123,208 123,160" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="362.0" y="189.0" width="210.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="467.0" y="204.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">本体传感器信号流 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">σ</tspan> 实时闭环反馈</text>
</svg>

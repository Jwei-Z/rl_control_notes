<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="1600" height="460" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="270" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="242" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">ReLIC 任务层角色掩码解耦与双通道哈达玛积融合架构 (§3)</text>
  <rect x="26" y="82" width="188" height="106" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="120.0" y="108.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 多模态任务输入 (§3.4)</text>
  <text x="120.0" y="129.5" text-anchor="middle" font-size="13.5" fill="#2b3035">自然语言 (GPT-4o + SAM 2)</text>
  <text x="120.0" y="150.5" text-anchor="middle" font-size="13.5" fill="#2b3035">或 3D 接触点 / 末端轨迹</text>
  <text x="120.0" y="171.5" text-anchor="middle" font-size="13.5" fill="#2b3035">生成序列 {<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>}</text>
  <rect x="242" y="82" width="196" height="106" rx="10" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="2"/>
  <text x="340.0" y="108.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 角色掩码与全身 IK (§3.1)</text>
  <text x="340.0" y="129.5" text-anchor="middle" font-size="13.5" fill="#2b3035">分配角色掩码 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> ∈ {0, 1}⁵</text>
  <text x="340.0" y="150.5" text-anchor="middle" font-size="13.5" fill="#2b3035">操作肢体末端目标 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">λ</tspan></tspan> ∈ SE(3)</text>
  <text x="340.0" y="171.5" text-anchor="middle" font-size="13.5" fill="#2b3035">全身 IK 解最优躯干 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">torso</tspan></text>
  <rect x="472" y="46" width="224" height="78" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="584.0" y="69.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3a. 模型化操作通道 MB (50 Hz)</text>
  <text x="584.0" y="90.0" text-anchor="middle" font-size="13.5" fill="#2b3035">针对 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">λ</tspan>) = 1 的操作肢体</text>
  <text x="584.0" y="111.0" text-anchor="middle" font-size="13.5" fill="#2b3035">DLS 微分 IK: <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q&#x0307;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">MB</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">λ</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">J</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">†</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">x&#x0307;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">des</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">p</tspan>Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">x</tspan>)</text>
  <rect x="472" y="146" width="224" height="78" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="584.0" y="169.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3b. 自适应平衡通道 RL (50 Hz)</text>
  <text x="584.0" y="190.0" text-anchor="middle" font-size="13.5" fill="#2b3035">针对 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">λ</tspan>) = 0 的支撑肢体</text>
  <text x="584.0" y="211.0" text-anchor="middle" font-size="13.5" fill="#2b3035">依 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> 自适应切换四足/三足步态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">RL</tspan></text>
  <rect x="730" y="82" width="184" height="106" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="822.0" y="108.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 动作掩码融合与伺服</text>
  <text x="822.0" y="129.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> ⊙ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">MB</tspan> + (1−<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">m</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>) ⊙ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">RL</tspan></text>
  <text x="822.0" y="150.5" text-anchor="middle" font-size="13.5" fill="#2b3035">输出 19 维目标关节角 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan></text>
  <text x="822.0" y="171.5" text-anchor="middle" font-size="13.5" fill="#2b3035">下发 1 kHz 电机位置闭环</text>
  <polyline points="214,135 242,135" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="438,110 472,85" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="438,160 472,185" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="696,85 730,115" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="696,185 730,155" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
</svg>

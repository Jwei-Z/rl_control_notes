  <text x="355.0" y="109.0" text-anchor="middle" font-size="13.5" fill="#2b3035">MLP [512, 256, 128] 实时推理</text>
  <text x="355.0" y="130.0" text-anchor="middle" font-size="13.5" fill="#2b3035">输出频率 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ω</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan>, 振幅 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">μ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan>, 偏置 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">x</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">off,<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan></text>
  <rect x="488" y="54" width="206" height="100" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="591.0" y="88.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 脊髓 CPG 发生器 (§2.2)</text>
  <text x="591.0" y="109.0" text-anchor="middle" font-size="13.5" fill="#2b3035">RG 层: Kuramoto 相位 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan>, 幅值 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan></text>
  <text x="591.0" y="130.0" text-anchor="middle" font-size="13.5" fill="#2b3035">PF 层: 映射足端轨迹 (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">x</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">foot</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">z</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">foot</tspan>)</text>
  <rect x="722" y="54" width="190" height="100" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="817.0" y="88.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 解析 IK 与 100 Hz PD</text>
  <text x="817.0" y="109.0" text-anchor="middle" font-size="13.5" fill="#2b3035">反解 12 维目标关节角 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">des</tspan></text>
  <text x="817.0" y="130.0" text-anchor="middle" font-size="13.5" fill="#2b3035">评估存活性 / CoT / 峰值力</text>

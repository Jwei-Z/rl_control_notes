  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">仿生大脑皮层 PPO + 脊髓两层 CPG 步态涌现闭环架构 (§2)</text>
  <rect x="26" y="54" width="196" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="124.0" y="88.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 多模态传感观测</text>
  <text x="124.0" y="109.0" text-anchor="middle" font-size="13.5" fill="#2b3035">本体: IMU / 编码器 / 触地</text>
  <text x="124.0" y="130.0" text-anchor="middle" font-size="13.5" fill="#2b3035">外感知: 距断崖边缘距离 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">d</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">gap</tspan></text>

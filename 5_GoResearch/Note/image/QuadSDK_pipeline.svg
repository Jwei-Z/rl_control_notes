  <text x="777.5" y="128.5" text-anchor="middle" font-size="13.5" fill="#2b3035">支撑腿力矩: <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">ff,st</tspan> = −<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">J</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">st</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">T</tspan> <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">ref</tspan></text>

  <text x="777.5" y="170.5" text-anchor="middle" font-size="13.5" fill="#2b3035">PD 闭环: <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">τ</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">τ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">ff</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">p</tspan>Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">d</tspan>Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">q&#x0307;</tspan></text>

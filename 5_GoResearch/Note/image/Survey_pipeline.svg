<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="1600" height="357" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="210" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="182" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">四足机器人自主导航与运动控制四层闭环架构 (§2–§6)</text>
  <rect x="28" y="54" width="200" height="96" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="128.0" y="86.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 多模态感知与状态估计</text>
  <text x="128.0" y="107.0" text-anchor="middle" font-size="13.5" fill="#2b3035">IMU / 编码器 + LiDAR / 深度相机</text>
  <text x="128.0" y="128.0" text-anchor="middle" font-size="13.5" fill="#2b3035">EKF 输出状态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">x&#x0302;</tspan> 与 2.5D/3D 地图</text>
  <rect x="256" y="54" width="200" height="96" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="356.0" y="86.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 高层导航与接触规划</text>
  <text x="356.0" y="107.0" text-anchor="middle" font-size="13.5" fill="#2b3035">可通行性评估 (坡度/粗糙度)</text>
  <text x="356.0" y="128.0" text-anchor="middle" font-size="13.5" fill="#2b3035">全局路径搜索与落足点 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">p</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">foot</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan></text>
  <rect x="484" y="54" width="200" height="96" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="584.0" y="86.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 中层运动控制器</text>
  <text x="584.0" y="107.0" text-anchor="middle" font-size="13.5" fill="#2b3035">模型派: SRBM-MPC + CPG</text>
  <text x="584.0" y="128.0" text-anchor="middle" font-size="13.5" fill="#2b3035">学习派: 特权蒸馏策略 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">θ</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">o</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>)</text>
  <rect x="712" y="54" width="200" height="96" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="812.0" y="86.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 底层全身力控与执行</text>
  <text x="812.0" y="107.0" text-anchor="middle" font-size="13.5" fill="#2b3035">HQP-WBC 逆动力学 / 关节 PD</text>
  <text x="812.0" y="128.0" text-anchor="middle" font-size="13.5" fill="#2b3035">输出 12 维电机驱动力矩 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">τ</tspan></text>
  <polyline points="228,102 256,102" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="456,102 484,102" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="684,102 712,102" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="812,150 812,180 128,180 128,150" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="350.0" y="161.0" width="240.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="470.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">本体传感与外部视觉实时闭环反馈 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">y</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>)</text>
</svg>

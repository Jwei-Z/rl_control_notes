  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#c92a2a">(a) 传统端到端 MPC 开环动力学打靶：<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan>+1</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">f</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>) — 高维关节空间采样，无内环反馈极易倾覆发散</text>

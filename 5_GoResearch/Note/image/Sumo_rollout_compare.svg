  <text x="30" y="160" font-size="14.5" font-weight="700" fill="#2b8a3e">(b) Sumo 策略内环打靶 (Policy-in-the-Loop Rollout)：<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan>+1</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">f</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">RL</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">g</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>))) — 降维采样且步步闭环自平衡</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="1600" height="409" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="230" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="872" height="202" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">生物与机器人步态切换的四大理论假说演进 (§1)</text>
  <rect x="30" y="76" width="190" height="84" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="125.0" y="102.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">动物与机器人</text>
  <text x="125.0" y="123.0" text-anchor="middle" font-size="13.5" fill="#2b3035">为什么随速度或地形</text>
  <text x="125.0" y="144.0" text-anchor="middle" font-size="13.5" fill="#2b3035">自主切换步态？</text>
  <rect x="270" y="36" width="275" height="48" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="407.5" y="54.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">假说 1 · 能量经济性假说</text>
  <text x="407.5" y="75.5" text-anchor="middle" font-size="13.5" fill="#2b3035">最小化单位距离运输能耗 CoT = P / (mgv)</text>
  <rect x="270" y="96" width="275" height="48" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="407.5" y="114.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">假说 2 · 骨骼肌肉防损伤假说</text>
  <text x="407.5" y="135.5" text-anchor="middle" font-size="13.5" fill="#2b3035">高速下切换步态以削减足端峰值地面反力 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">f</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">grf</tspan></text>
  <rect x="270" y="156" width="275" height="48" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="407.5" y="174.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">假说 3 · 周期动力学稳定性假说</text>
  <text x="407.5" y="195.5" text-anchor="middle" font-size="13.5" fill="#2b3035">降低步态相位方差，抑制周期轨道发散</text>
  <rect x="600" y="56" width="270" height="124" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <text x="735.0" y="91.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">本文核心结论 · 存活性第一性原理</text>
  <text x="735.0" y="112.5" text-anchor="middle" font-size="13.5" fill="#2b3035">存活性 (Viability / 防跌落倾覆)</text>
  <text x="735.0" y="133.5" text-anchor="middle" font-size="13.5" fill="#2b3035">才是步态切换的根本驱动力；</text>
  <text x="735.0" y="154.5" text-anchor="middle" font-size="13.5" fill="#2b3035">省能与减震仅是存活域充裕时的副产物</text>
  <polyline points="220,100 270,60" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="220,118 270,120" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="220,136 270,180" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="545,60 600,95" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="545,120 600,118" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="545.0" y="97.0" width="54.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="572.0" y="112.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">统一解释</text>
  <polyline points="545,180 600,140" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
</svg>

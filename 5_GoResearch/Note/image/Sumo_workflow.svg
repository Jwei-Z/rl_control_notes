<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="1600" height="374" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="220" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="192" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">Sumo 高层 20 Hz 样条采样 MPC + 底层 50 Hz 预训练 RL 策略内环打靶架构 (§3)</text>
  <rect x="26" y="54" width="200" height="104" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="126.0" y="79.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 状态感知与时移热启动</text>
  <text x="126.0" y="100.5" text-anchor="middle" font-size="13.5" fill="#2b3035">融合机器人与物体状态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">0</tspan></text>
  <text x="126.0" y="121.5" text-anchor="middle" font-size="13.5" fill="#2b3035">上一周期样条前移 Δ<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan> = 50 ms</text>
  <text x="126.0" y="142.5" text-anchor="middle" font-size="13.5" fill="#2b3035">得控制点初始均值 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">A&#x0304;</tspan></text>
  <rect x="252" y="54" width="205" height="104" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="354.5" y="79.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 样条控制点采样 (§3.4–3.5)</text>
  <text x="354.5" y="100.5" text-anchor="middle" font-size="13.5" fill="#2b3035">在 4 个节点采样 64 组扰动 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">A</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan></text>
  <text x="354.5" y="121.5" text-anchor="middle" font-size="13.5" fill="#2b3035">时域递增标准差 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">σ</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>) ∈ [0.02, 0.6]</text>
  <text x="354.5" y="142.5" text-anchor="middle" font-size="13.5" fill="#2b3035">线性样条插值连续指令 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>)</text>
  <rect x="483" y="54" width="215" height="104" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="590.5" y="79.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 策略内环并行打靶 (§3.3)</text>
  <text x="590.5" y="100.5" text-anchor="middle" font-size="13.5" fill="#2b3035">CPU 多线程 MuJoCo 前向推演 1.5 s</text>
  <text x="590.5" y="121.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan>+1</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">f</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">RL</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">g</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan>)))</text>
  <text x="590.5" y="142.5" text-anchor="middle" font-size="13.5" fill="#2b3035">评估极简几何任务代价 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">J</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan></text>
  <rect x="724" y="54" width="190" height="104" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="819.0" y="79.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. CEM 更新与实机执行</text>
  <text x="819.0" y="100.5" text-anchor="middle" font-size="13.5" fill="#2b3035">筛选前 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">elites</tspan> 精英更新样条 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒮</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan></text>
  <text x="819.0" y="121.5" text-anchor="middle" font-size="13.5" fill="#2b3035">取首步 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">0</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒮</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan>(0) 输入 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">RL</tspan></text>
  <text x="819.0" y="142.5" text-anchor="middle" font-size="13.5" fill="#2b3035">50 Hz 输出 19 维关节指令 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan></text>
  <polyline points="226,106 252,106" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="457,106 483,106" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="698,106 724,106" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="819,158 819,188 126,188 126,158" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="317.0" y="169.0" width="310.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="472.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">下一控制周期 (20 Hz) 状态反馈 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">0</tspan> 与最优样条 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒮</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">*</tspan> 热启动</text>
</svg>

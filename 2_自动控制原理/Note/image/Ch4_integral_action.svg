<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="1600" height="218" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="120" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="24" y="30" width="210" height="60" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
  <text x="129.0" y="54.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">残余稳态误差 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">e</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>) ≠ 0</text>
  <text x="129.0" y="75.5" text-anchor="middle" font-size="13.5" fill="#2b3035">比例控制下重力/常值扰动残差</text>
  <rect x="300" y="30" width="260" height="60" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="430.0" y="54.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">积分控制器 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">u</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">I</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>) = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">K</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">I</tspan> ∫ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">e</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan>) d<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan></text>
  <text x="430.0" y="75.5" text-anchor="middle" font-size="13.5" fill="#2b3035">对历史误差持续时间积分累加</text>
  <rect x="626" y="30" width="230" height="60" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="741.0" y="54.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">驱动输出 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">u</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>) 单调递增/递减</text>
  <text x="741.0" y="75.5" text-anchor="middle" font-size="13.5" fill="#2b3035">直至迫使稳态误差严格归零 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">e</tspan>(∞) = 0</text>
  <polyline points="234,60 300,60" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="560,60 626,60" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="1600" height="309" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="170" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="852" height="142" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">控制系统失稳的两大物理与数学根源 (§1.4)</text>
  <rect x="30" y="62" width="210" height="64" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
  <text x="135.0" y="88.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">系统失稳的两大根源</text>
  <text x="135.0" y="109.5" text-anchor="middle" font-size="13.5" fill="#2b3035">(右半复平面极点 Re(s) > 0)</text>
  <rect x="300" y="36" width="545" height="50" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="572.5" y="55.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">根源一 · 被控对象本体开环不稳定 (Open-Loop Unstable Plant)</text>
  <text x="572.5" y="76.5" text-anchor="middle" font-size="13.5" fill="#2b3035">物理系统自身缺乏恢复力矩（如倒立摆、静不稳定战机），无主动控制必发散倾覆</text>
  <rect x="300" y="98" width="545" height="50" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="572.5" y="117.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">根源二 · 闭环负反馈相位滞后与高增益引发的失稳</text>
  <text x="572.5" y="138.5" text-anchor="middle" font-size="13.5" fill="#2b3035">传感器/执行器惯性延时导致相位滞后达 180°，负反馈退化为正反馈自激振荡</text>
  <polyline points="240,80 300,61" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="240,108 300,123" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
</svg>

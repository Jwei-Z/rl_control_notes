<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 120" width="1600" height="223" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">

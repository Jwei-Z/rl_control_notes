  <rect x="310" y="28" width="240" height="64" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="430.0" y="54.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">线性时不变系统传递函数</text>
  <text x="430.0" y="75.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">G</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>) = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">N</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>) / <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">D</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>)  (零初始条件)</text>
  <rect x="620" y="34" width="200" height="52" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="1600" height="231" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="130" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="872" height="102" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">双曲正切压扁高斯分布 (Squashed Gaussian) 与雅可比行列式概率密度修正 (Appendix C)</text>
  <rect x="28" y="48" width="245" height="54" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="150.5" y="69.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 无界高斯采样 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan> ∈ (−∞, +∞)</text>
  <text x="150.5" y="90.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">μ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan>) + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">σ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan>) ⊙ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">ϵ</tspan>,  <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">ϵ</tspan> ~ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒩</tspan>(0, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">I</tspan>)</text>
  <rect x="328" y="48" width="220" height="54" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="438.0" y="69.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 双曲正切非线性压扁映射</text>
  <text x="438.0" y="90.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan> = tanh(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan>) ∈ (−1, +1)ᴰ</text>
  <rect x="603" y="48" width="268" height="54" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="737.0" y="69.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 变量替换定理修正对数概率密度</text>
  <text x="737.0" y="90.5" text-anchor="middle" font-size="13.5" fill="#2b3035">log <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan>) = log <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">μ</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan>) − ∑ log(1 − tanh²(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">u</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">i</tspan></tspan>))</text>
  <polyline points="273,75 328,75" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="281.0" y="51.0" width="38.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="300.0" y="66.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">tanh</text>
  <polyline points="548,75 603,75" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="549.0" y="51.0" width="52.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="575.0" y="66.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">det(d<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan>/d<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan>)</text>
</svg>

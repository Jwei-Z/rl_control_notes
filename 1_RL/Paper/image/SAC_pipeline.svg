<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="1600" height="357" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="210" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="182" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">SAC 软演员-评论家最大熵强化学习闭环执行流水线 (§3–§5)</text>
  <rect x="26" y="54" width="198" height="98" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="125.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 随机重参数化交互采样</text>
  <text x="125.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan> ~ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒩</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">μ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">σ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">2</tspan>), 动作 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan> = tanh(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">u</tspan>)</text>
  <text x="125.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">转换元组 (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan>) 存入 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒟</tspan></text>
  <rect x="250" y="54" width="212" height="98" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="356.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 软状态价值与截断双 Q 更新</text>
  <text x="356.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">targ</tspan> = min(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>₁</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>₂</tspan>) − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">α</tspan> log <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan>)</text>
  <text x="356.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">最小化软贝尔曼残差更新 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ψ</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">1</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">2</tspan></text>
  <rect x="488" y="54" width="208" height="98" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="592.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 重参数化路径导数更新策略</text>
  <text x="592.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">令 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">f</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">ϵ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>; <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>), <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">ϵ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> ~ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒩</tspan>(0, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">I</tspan>)</text>
  <text x="592.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">最小化 KL 散度目标 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">J</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan>) 更新 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></text>
  <rect x="722" y="54" width="192" height="98" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="818.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 温度自适应与软目标同步</text>
  <text x="818.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">最小化对偶目标 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">J</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">α</tspan>) 自动调节 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">α</tspan></text>
  <text x="818.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">指数移动平均更新 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ψ&#x0304;</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τψ</tspan> + (1−<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">τ</tspan>)<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ψ&#x0304;</tspan></text>
  <polyline points="224,103 250,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="462,103 488,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="696,103 722,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="818,152 818,182 125,182 125,152" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="346.0" y="163.0" width="250.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="471.0" y="178.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">继续从环境采样并执行小批量随机梯度更新</text>
</svg>

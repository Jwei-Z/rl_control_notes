<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="1600" height="357" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="210" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="182" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">TD3 双延迟深度确定性策略梯度算法闭环执行流水线 (§3–§5)</text>
  <rect x="26" y="54" width="196" height="98" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="124.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 探索采样与经验回放</text>
  <text x="124.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">动作 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>) + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϵ</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϵ</tspan> ~ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">𝒩</tspan>(0, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">σ</tspan>²)</text>
  <text x="124.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">转换元组 (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>′) 存入经验池 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ℬ</tspan></text>
  <rect x="248" y="54" width="210" height="98" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="353.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 目标策略平滑正则化</text>
  <text x="353.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a&#x0303;</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan>′</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>′) + clip(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϵ</tspan>, −<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">c</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">c</tspan>)</text>
  <text x="353.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">低通滤波抹平价值函数伪局部尖峰</text>
  <rect x="484" y="54" width="210" height="98" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="589.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 截断双 Q (CDQ) 价值更新</text>
  <text x="589.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">y</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γ</tspan> min(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>₁′</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>′,<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a&#x0303;</tspan>), <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>₂′</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>′,<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a&#x0303;</tspan>))</text>
  <text x="589.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">每步最小化均方贝尔曼误差更新 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">1</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">2</tspan></text>
  <rect x="720" y="54" width="194" height="98" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="817.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 延迟更新 Actor (每 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">d</tspan> = 2 步)</text>
  <text x="817.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">∇<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">J</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan>) = 𝔼[∇<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">Q</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>₁</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>,<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a</tspan>) · ∇<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan>)]</text>
  <text x="817.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">Polyak 软更新目标网络 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan>′, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">1</tspan>′, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">2</tspan>′</text>
  <polyline points="222,103 248,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="458,103 484,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="694,103 720,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="817,152 817,182 124,182 124,152" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="390.0" y="163.0" width="160.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="470.0" y="178.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">下一训练时间步 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan> + 1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="1600" height="357" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="210" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="182" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">广义优势估计 (GAE) 与信任域策略-价值双更新流水线 (§3–§5)</text>
  <rect x="26" y="54" width="195" height="98" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="123.5" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 批次轨迹交互采集</text>
  <text x="123.5" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">在当前策略 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan></tspan></tspan> 下与环境交互</text>
  <text x="123.5" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">收集状态-动作-奖励序列 {<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>}</text>
  <rect x="247" y="54" width="210" height="98" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="352.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. 单步 TD 残差序列计算</text>
  <text x="352.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">调用价值网络 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>) 计算残差</text>
  <text x="352.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan>) − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>)</text>
  <rect x="483" y="54" width="215" height="98" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="590.5" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. GAE 指数加权反向递推</text>
  <text x="590.5" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A&#x0302;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">GAE</tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan></tspan> + (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γλ</tspan>)<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A&#x0302;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">GAE</tspan></text>
  <text x="590.5" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">通过参数 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">λ</tspan> ∈ [0, 1] 折中偏差与方差</text>
  <rect x="724" y="54" width="190" height="98" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="819.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. Actor-Critic 信任域更新</text>
  <text x="819.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">Actor: 共轭梯度自然梯度更新 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan></text>
  <text x="819.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">Critic: 信任域约束拟合更新 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϕ</tspan></text>
  <polyline points="221,103 247,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="457,103 483,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="698,103 724,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="819,152 819,182 123,182 123,152" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="386.0" y="163.0" width="170.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="471.0" y="178.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">进入下一迭代轮次 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">k</tspan> + 1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="1600" height="357" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="210" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="14" y="14" width="912" height="182" rx="12" fill="#f8f9fa" fill-opacity="0.75" stroke="#495057" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="30" y="40" font-size="14.5" font-weight="700" fill="#212529">PPO 近端策略优化单轮迭代执行流水线 (§3–§5)</text>
  <rect x="26" y="54" width="200" height="98" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="126.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">1. 并行环境轨迹采样</text>
  <text x="126.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">固定旧策略参数 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>old</tspan></text>
  <text x="126.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">N</tspan> 个并行 Actor 采集 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">T</tspan> 步数据</text>
  <rect x="252" y="54" width="210" height="98" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="357.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">2. TD 残差与 GAE 优势估计</text>
  <text x="357.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">old</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan>) − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">old</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>)</text>
  <text x="357.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">反向递推计算 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A&#x0302;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> 与 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">V</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">targ</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>)</text>
  <rect x="488" y="54" width="210" height="98" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="593.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">3. 重要性比率与截断目标 (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">K</tspan> 轮)</text>
  <text x="593.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">比率 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>) = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan></tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>) / <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>old</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">a</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">s</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>)</text>
  <text x="593.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">L</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">CLIP</tspan> = 𝔼[min(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A&#x0302;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, clip(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">r</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, 1±<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">ϵ</tspan>)<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A&#x0302;</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>)]</text>
  <rect x="724" y="54" width="190" height="98" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="819.0" y="87.0" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">4. 联合损失一阶梯度更新</text>
  <text x="819.0" y="108.0" text-anchor="middle" font-size="13.5" fill="#2b3035">max (<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">L</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">CLIP</tspan> − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">c</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">1</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">L</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super">VF</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">c</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">2</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan>[<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan></tspan>])</text>
  <text x="819.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#2b3035">Adam 更新后同步 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">old</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan></text>
  <polyline points="226,103 252,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="462,103 488,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="698,103 724,103" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="819,152 819,182 126,182 126,152" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="312.0" y="163.0" width="320.0" height="21" rx="4" fill="#ffffff" fill-opacity="0.94"/>
  <text x="472.0" y="178.0" text-anchor="middle" font-size="13" font-weight="600" fill="#495057">将最新策略权重同步至采样策略 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub">old</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">θ</tspan>，开启下一轮采样</text>

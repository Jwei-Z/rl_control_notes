<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="1600" height="528" style="width:100%;height:auto;max-width:100%;display:block;" font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#495057"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="310" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="16" y="16" width="440" height="278" rx="12" fill="#fff9eb" fill-opacity="0.75" stroke="#e67700" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="32" y="42" font-size="14.5" font-weight="700" fill="#d9480f">带基线的 REINFORCE (蒙特卡洛策略梯度：需等待整幕结束)</text>
  <rect x="36" y="56" width="180" height="48" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <text x="126.0" y="74.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">当前状态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan></text>
  <text x="126.0" y="95.5" text-anchor="middle" font-size="13.5" fill="#2b3035">抽样执行动作 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> ~ <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan>)</text>
  <rect x="256" y="56" width="180" height="48" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="346.0" y="74.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">状态价值基线 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan>)</text>
  <text x="346.0" y="95.5" text-anchor="middle" font-size="13.5" fill="#2b3035">仅作动作前的被动减方差基准</text>
  <rect x="36" y="126" width="400" height="62" rx="10" fill="#ffe8cc" stroke="#d9480f" stroke-width="2"/>
  <text x="236.0" y="151.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">必须等待整幕交互直至终止时刻 T 才能计算完整回报</text>
  <text x="236.0" y="172.5" text-anchor="middle" font-size="13.5" fill="#2b3035">累计真实蒙特卡洛回报：<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">G</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">R</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γR</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+2</tspan> + … + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">T</tspan>−<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>−1</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">R</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">T</tspan></tspan></text>
  <rect x="36" y="210" width="400" height="68" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
  <text x="236.0" y="238.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">利用无偏回报差 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">G</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan>) 离线更新</text>
  <text x="236.0" y="259.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">α</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>∇ln <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>|<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan>)  (方差高，无法单步在线更新)</text>
  <polyline points="126,104 126,126" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="346,104 346,210" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="126,188 126,210" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <rect x="484" y="16" width="440" height="278" rx="12" fill="#f3fbf4" fill-opacity="0.75" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="500" y="42" font-size="14.5" font-weight="700" fill="#2b8a3e">单步 Actor-Critic (时序差分自举策略梯度：单步实时更新)</text>
  <rect x="504" y="56" width="190" height="48" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="599.0" y="74.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">当前状态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> 执行 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">A</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan></text>
  <text x="599.0" y="95.5" text-anchor="middle" font-size="13.5" fill="#2b3035">观测即时奖励 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">R</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan> 与下一状态 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan></text>
  <rect x="718" y="56" width="186" height="48" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="811.0" y="74.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">Critic 价值评估网络</text>
  <text x="811.0" y="95.5" text-anchor="middle" font-size="13.5" fill="#2b3035">同时评估 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan>) 与 <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan>)</text>
  <rect x="504" y="126" width="400" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="704.0" y="151.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">无需等待回合结束，单步自举构造 TD 残差估计优势</text>
  <text x="704.0" y="172.5" text-anchor="middle" font-size="13.5" fill="#2b3035"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan> = <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">R</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">γ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan>+1</tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan>) − <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan>(<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">S</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>, <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan>)</text>
  <rect x="504" y="210" width="400" height="68" rx="10" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2"/>
  <text x="704.0" y="238.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e1e1e">当前时间步 t 立即同步更新 Actor 与 Critic 参数</text>
  <text x="704.0" y="259.5" text-anchor="middle" font-size="13.5" fill="#2b3035">Actor: <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">α</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700">θ</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">I</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>∇ln <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">π</tspan>  |  Critic: <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan> ← <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan> + <tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">α</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="super"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700">w</tspan></tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">δ</tspan><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-size="74%" baseline-shift="sub"><tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">t</tspan></tspan>∇<tspan font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic">v&#x0302;</tspan></text>
  <polyline points="599,104 599,126" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="811,104 811,126" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
  <polyline points="704,188 704,210" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow-end)"/>
</svg>
